<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تدوين وإدارة المقالات | منصة اتقِ الله</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* التوافق التام مع الهوية البصرية الملكية للمنصة */
        :root {
            --color-bg: #F5F1E6;  
            --color-card-bg: rgba(255, 255, 255, 0.9);
            --color-burgundy: #8B2E2E; 
            --color-burgundy-dark: #5A1C1C;
            --color-gold: #C5A059; 
            --color-text-main: #2D2522;
            --color-text-muted: #7A706C;
            --glass-border: rgba(139, 46, 46, 0.12);
            --glass-shadow: 0 12px 40px 0 rgba(139, 46, 46, 0.04);
            --radius-main: 24px;
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--color-bg);
            background-image: radial-gradient(at 0% 0%, rgba(197, 160, 89, 0.04) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(139, 46, 46, 0.03) 0px, transparent 50%);
            color: var(--color-text-main);
            padding-top: 110px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            background: var(--color-card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-main);
            box-shadow: var(--glass-shadow);
        }

        .nav-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--color-gold); object-fit: cover; }

        /* --- حاوية التصميم الإبداعي --- */
        .dashboard-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 24px 60px 24px;
            width: 100%;
            flex: 1;
        }

        .dashboard-header { text-align: center; margin-bottom: 40px; }
        .dashboard-header h1 { color: var(--color-burgundy); font-size: 32px; font-weight: 900; margin-bottom: 8px; }
        .dashboard-header p { font-size: 16px; color: var(--color-text-muted); font-weight: 500; }
        .welcome-badge { display: inline-block; background: rgba(197, 160, 89, 0.12); color: #856423; font-weight: 800; padding: 6px 18px; border-radius: 30px; margin-top: 10px; font-size: 14px; }

        /* --- استمارة الصياغة والنشر الفاخرة --- */
        .form-section { padding: 35px; margin-bottom: 45px; border: 1px solid rgba(139, 46, 46, 0.08); position: relative; }
        .section-title { font-size: 22px; font-weight: 800; color: var(--color-burgundy); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--color-gold); padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .full-width { grid-column: span 2; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 14.5px; font-weight: 700; color: var(--color-text-main); }
        .input-group label i { color: var(--color-gold); margin-left: 4px; }
        
        .form-control {
            width: 100%; background: #fff; border: 1px solid var(--glass-border); padding: 12px 18px;
            border-radius: 14px; font-size: 14.5px; font-weight: 600; color: var(--color-text-main); outline: none;
            transition: var(--transition-smooth);
        }
        .form-control:focus { border-color: var(--color-burgundy); box-shadow: 0 0 0 4px rgba(139, 46, 46, 0.06); }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 150px; font-family: inherit; line-height: 1.7; }

        .form-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 25px; border-top: 1px solid rgba(139, 46, 46, 0.08); padding-top: 20px; }
        .btn-submit {
            background: linear-gradient(135deg, var(--color-burgundy) 0%, var(--color-burgundy-dark) 100%);
            color: #fff; border: none; padding: 12px 35px; border-radius: 50px; font-weight: 700; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(139, 46, 46, 0.2);
            transition: var(--transition-smooth);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 46, 46, 0.3); }
        
        .btn-cancel {
            background: #e0e0e0; color: #4a4a4a; border: none; padding: 12px 25px; border-radius: 50px;
            font-weight: 700; font-size: 15px; cursor: pointer; transition: var(--transition-smooth); display: none;
        }
        .btn-cancel:hover { background: #d5d5d5; }

        /* --- قسم إدارة مقالاتي الجلاسمورفيزم --- */
        .my-articles-section { width: 100%; }
        .articles-list { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        
        .panel-item {
            display: flex; align-items: center; justify-content: space-between; padding: 20px 25px;
            border-radius: 18px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(139, 46, 46, 0.06);
            transition: var(--transition-smooth); gap: 20px;
        }
        .panel-item:hover { transform: scale(1.01); background: #fff; border-color: rgba(197, 160, 89, 0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.02); }
        
        .item-info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 0; }
        .item-img-preview { width: 65px; height: 65px; border-radius: 12px; object-fit: cover; border: 1px solid var(--glass-border); background: #eee; flex-shrink: 0; }
        .item-details { min-width: 0; }
        .item-title { font-size: 16.5px; font-weight: 800; color: var(--color-burgundy); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-meta { display: flex; gap: 15px; font-size: 12px; color: var(--color-text-muted); font-weight: 600; }
        .item-tag { color: var(--color-gold); font-weight: 700; }

        .item-actions { display: flex; gap: 10px; flex-shrink: 0; }
        .action-btn {
            border: none; padding: 8px 16px; border-radius: 30px; font-weight: 700; font-size: 13px;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition-smooth);
        }
        .btn-edit { background: rgba(197, 160, 89, 0.12); color: #856423; }
        .btn-edit:hover { background: var(--color-gold); color: #fff; }
        .btn-delete { background: rgba(198, 40, 40, 0.08); color: #c62828; }
        .btn-delete:hover { background: #c62828; color: #fff; }

        /* لودر التحديث السحابي */
        .loading-box { text-align: center; color: var(--color-burgundy); font-weight: bold; padding: 30px 0; }

        @media (max-width: 768px) {
            body { padding-top: 90px; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .form-section { padding: 20px; }
            .panel-item { flex-direction: column; align-items: flex-start; padding: 15px; gap: 15px; }
            .item-actions { width: 100%; justify-content: flex-end; border-top: 1px dashed #eee; padding-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>غرفة إدارة وصناعة المقالات التعليمية</h1>
            <p>اكتب، عدّل، وتحكّم في منشوراتك الأكاديمية المربوطة بسحابة اتقِ الله</p>
            <span class="welcome-badge" id="welcomeAuthorName">جاري التعرف على الهوية الرقمية...</span>
        </div>

        <!-- استمارة النشر والتعديل الديناميكية -->
        <div class="form-section glass-panel">
            <h2 class="section-title" id="formTitle"><i class="fa-solid fa-pen-nib"></i> صياغة مقال أكاديمي جديد</h2>
            
            <form id="articleForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label><i class="fa-solid fa-heading"></i> عنوان المقال الرئيسي</label>
                        <input type="text" id="articleTitle" class="form-control" placeholder="أدخل عنواناً قوياً وجذاباً..." required>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-paragraph"></i> العنوان الفرعي (اختياري)</label>
                        <input type="text" id="articleSubtitle" class="form-control" placeholder="أضف تفصيلاً أو توضيحاً فرعياً للمانشيت...">
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-tags"></i> تصنيف وفئة المقال</label>
                        <select id="articleTag" class="form-control" required>
                            <option value="عام" selected>عام</option>
                            <option value="قرارات وزارية">قرارات وزارية</option>
                            <option value="نصائح دراسية">نصائح دراسية</option>
                            <option value="شروحات">شروحات ومواد</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-image"></i> رابط صورة الواجهة (URL)</label>
                        <input type="url" id="articleImageUrl" class="form-control" placeholder="https://example.com/image.webp">
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-square-check"></i> نص زر الإجراء (مثل: تصفح البنك)</label>
                        <input type="text" id="articleBtnText" class="form-control" placeholder="اترك الخانتين فارغتين إذا لم تكن بحاجة لزر خارجي">
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-link"></i> رابط وجهة الزر (URL)</label>
                        <input type="url" id="articleBtnUrl" class="form-control" placeholder="https://atqallah.com/library.html">
                    </div>

                    <div class="input-group full-width">
                        <label><i class="fa-solid fa-file-lines"></i> محتوى ومتن المقال تفصيلياً</label>
                        <textarea id="articleContent" class="form-control" placeholder="اكتب موضوعك هنا بعناية، يدعم النزول لأسطر جديدة للتنسيق البديع..." required></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelEditBtn" class="btn-cancel">إلغاء التعديل</button>
                    <button type="submit" id="submitBtn" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> <span id="submitBtnText">اعتماد ونشر المقال فوراً</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- جدول / قائمة المقالات الخاصة بالمستخدم الحالي -->
        <div class="my-articles-section">
            <h2 class="section-title"><i class="fa-solid fa-folder-open"></i> مقالاتي المنشورة سابقاً</h2>
            <div class="articles-list" id="myArticlesContainer">
                <div class="loading-box">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 26px; margin-bottom: 8px;"></i>
                    <p>في انتظار تسجيل دخولك لجلب مستنداتك الخاصة السحابية...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, onSnapshot, doc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ─── حماية الصفحة: التحقق من صلاحية الجلسة ───
        const email = localStorage.getItem('authenticatedUserEmail');
        const timestamp = localStorage.getItem('sessionTimestamp');
        const SESSION_DURATION_MS = 24 * 60 * 60 * 1000;
        if (!email || !timestamp || (Date.now() - parseInt(timestamp, 10)) >= SESSION_DURATION_MS) {
            localStorage.removeItem('authenticatedUserEmail');
            localStorage.removeItem('sessionTimestamp');
            alert('انتهت صلاحية جلستك الأمنية. يرجى تسجيل الدخول مرة أخرى.');
            window.location.href = 'auth.html';
        }

        let currentAuthorUid = null;
        let currentAuthorName = "طالب منصة";
        let editingArticleId = null; // يحمل ID المقال الحالي عند التعديل

        // مراقبة الهيدر
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 40) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        }, { passive: true });

        // التحقق من الهوية وجلب مقالات الكاتب فقط
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentAuthorUid = user.uid;
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const uData = userDoc.data();
                        if (uData.status === 'blocked') { window.location.href = "block.html"; return; }
                        
                        currentAuthorName = uData.fullName || "طالب";
                        document.getElementById('nav-user-name').innerText = currentAuthorName.split(' ')[0];
                        document.getElementById('welcomeAuthorName').innerText = `مرحباً بالكاتب المعتمد: ${currentAuthorName} ✨`;
                        
                        let avatar = uData.avatarId || "1.webp";
                        if(!avatar.includes('.')) avatar += ".webp";
                        document.getElementById('nav-user-avatar').src = avatar;
                    }
                } catch (e) { console.error(e); }
                
                // جلب قائمة المقالات الخاصة بهذا المستخدم فقط حياً
                listenToMyArticles(user.uid);
            } else {
                alert("تنبيه أمني: هذه الصفحة مخصصة للموثقين وصناع المحتوى، يرجى تسجيل الدخول أولاً.");
                window.location.href = "auth.html";
            }
        });

        // --- جلب مقالات المستخدم الحالي وتحديث القائمة حياً ---
        function listenToMyArticles(uid) {
            const container = document.getElementById('myArticlesContainer');
            const q = query(collection(db, "articles"), where("authorUid", "==", uid));
            
            onSnapshot(q, (snapshot) => {
                container.innerHTML = "";
                const myArticles = [];
                snapshot.forEach(doc => myArticles.push({ id: doc.id, ...doc.data() }));
                
                // ترتيب محلي من الأحدث للأقدم
                myArticles.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if(myArticles.length === 0) {
                    container.innerHTML = `<p style="text-align:center; font-weight:700; color:var(--color-text-muted); padding:30px;">لم تقم بنشر أي مقالات تعليمية باسمك حتى الآن.</p>`;
                    return;
                }

                myArticles.forEach((article) => {
                    const panelItem = document.createElement('div');
                    panelItem.className = "panel-item";
                    
                    const imgUrl = article.imageUrl || 'at.webp'; // صورة احتياطية في حال لم يرفع صورة

                    panelItem.innerHTML = `
                        <div class="item-info">
                            <img src="${imgUrl}" class="item-img-preview" alt="Preview">
                            <div class="item-details">
                                <h4 class="item-title">${article.title}</h4>
                                <div class="item-meta">
                                    <span class="item-tag"><i class="fa-solid fa-hashtag"></i> ${article.tag || 'عام'}</span>
                                    <span><i class="fa-solid fa-clock"></i> ${article.date || 'يونيو 2026'}</span>
                                    <span><i class="fa-solid fa-thumbs-up"></i> ${(article.likedBy || []).length}</span>
                                </div>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn btn-edit" onclick="window.prepareEditArticle('${article.id}')">
                                <i class="fa-solid fa-user-gear"></i> تعديل
                            </button>
                            <button class="action-btn btn-delete" onclick="window.deleteArticleConfirm('${article.id}')">
                                <i class="fa-solid fa-trash-can"></i> حذف
                            </button>
                        </div>
                    `;
                    container.appendChild(panelItem);
                });
            }, err => console.error("Error drawing authors items panel:", err));
        }

        // --- معالجة إرسال النموذج (نشر مقال جديد أو تحديث مقال قائم) ---
        document.getElementById('articleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentAuthorUid) return;

            const title = document.getElementById('articleTitle').value.trim();
            const subtitle = document.getElementById('articleSubtitle').value.trim();
            const tag = document.getElementById('articleTag').value;
            const imageUrl = document.getElementById('articleImageUrl').value.trim();
            const btnText = document.getElementById('articleBtnText').value.trim();
            const btnUrl = document.getElementById('articleBtnUrl').value.trim();
            const content = document.getElementById('articleContent').value.trim();

            // صياغة اسم وتاريخ النشر الحالي ديناميكياً لعام 2026
            const localesOptions = { month: 'long', year: 'numeric' };
            const formattedDate = new Date().toLocaleDateString('ar-EG', localesOptions); // مثل: "يونيو 2026"

            try {
                if (editingArticleId) {
                    // وضع التحديث (Update Mode)
                    const docRef = doc(db, "articles", editingArticleId);
                    await updateDoc(docRef, {
                        title, subtitle, tag, imageUrl, btnText, btnUrl, content
                    });
                    alert("🎉 تم تحديث بيانات المقال التعليمي بنجاح، وجاري مزامنتها في السحابة الرئيسية!");
                    resetFormState();
                } else {
                    // وضع النشر الجديد (Create Mode)
                    await addDoc(collection(db, "articles"), {
                        title,
                        subtitle,
                        tag,
                        imageUrl,
                        btnText,
                        btnUrl,
                        content,
                        author: currentAuthorName,
                        authorUid: currentAuthorUid,
                        date: formattedDate,
                        status: "approved", // يتم اعتماده تلقائياً ليظهر فوراً في خلاصة مركز الأخبار
                        timestamp: serverTimestamp(),
                        likedBy: [],
                        dislikedBy: [],
                        readBy: []
                    });
                    alert("🚀 تهانينا! تم نشر مقالك بنجاح، وربطه فوراً بنظام المكافآت لدفعة البكالوريا!");
                    document.getElementById('articleForm').reset();
                }
            } catch (error) {
                console.error("Error writing data to firestore:", error);
                alert("حدث خلل في معالجة البيانات، تفقد الاتصال السحابي بقواعد البيانات وأعد المحاولة!");
            }
        });

        // --- تهيئة المقال وسحب بياناته للاستمارة من أجل التعديل ---
        window.prepareEditArticle = async function(id) {
            try {
                const docSnap = await getDoc(doc(db, "articles", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // ملء عناصر وحقول النموذج ببيانات المقال القديمة لتعديلها
                    document.getElementById('articleTitle').value = data.title || "";
                    document.getElementById('articleSubtitle').value = data.subtitle || "";
                    document.getElementById('articleTag').value = data.tag || "عام";
                    document.getElementById('articleImageUrl').value = data.imageUrl || "";
                    document.getElementById('articleBtnText').value = data.btnText || "";
                    document.getElementById('articleBtnUrl').value = data.btnUrl || "";
                    document.getElementById('articleContent').value = data.content || "";

                    // تحويل حالة الأزرار والعناوين في الواجهة
                    editingArticleId = id;
                    document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> تعديل وتحديث المقال الحالى`;
                    document.getElementById('submitBtnText').innerText = "حفظ التغييرات وتحديث السحابة";
                    document.getElementById('cancelEditBtn').style.display = "inline-block";

                    // تمرير الشاشة لأعلى بسلاسة ليرى المستخدم الاستمارة بعد تعبئتها
                    window.scrollTo({ top: 150, behavior: 'smooth' });
                }
            } catch (e) { console.error("Error fetching article details for editing:", e); }
        };

        // --- حذف المقال نهائياً من القواعد السحابية ---
        window.deleteArticleConfirm = async function(id) {
            const check = confirm("⚠️ تنبيه هام: هل أنت متأكد تماماً من رغبتك في حذف هذا المقال نهائياً؟ لا يمكن استرجاع البيانات المقترنة به بعد إتمام هذا الإجراء!");
            if(check) {
                try {
                    await deleteDoc(doc(db, "articles", id));
                    alert("🗑️ تم حذف وثيقة المقال بنجاح من كافة سجلات خوادم الفايربيز.");
                    if(editingArticleId === id) resetFormState();
                } catch (e) { console.error("Deletion error transaction:", e); }
            }
        };

        // إلغاء وضع التعديل وتصفير الاستمارة
        document.getElementById('cancelEditBtn').addEventListener('click', resetFormState);

        function resetFormState() {
            editingArticleId = null;
            document.getElementById('articleForm').reset();
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-nib"></i> صياغة مقال أكاديمي جديد`;
            document.getElementById('submitBtnText').innerText = "اعتماد ونشر المقال فوراً";
            document.getElementById('cancelEditBtn').style.display = "none";
        }
    </script>

    <script src="components.js"></script>
</body>
</html>
